apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 10s          # matches the scrape interval

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # Link a log line's tenant back to a metrics view, etc. (optional derived fields go here).
      maxLines: 1000
