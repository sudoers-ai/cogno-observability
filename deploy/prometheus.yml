global:
  scrape_interval: 10s          # near-real-time: dashboards refresh every 5-15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/cogno_rules.yml

scrape_configs:
  - job_name: cogno-host
    metrics_path: /metrics
    static_configs:
      # A cogno-host running as a bare process on the Docker host. If the host runs in THIS compose
      # network instead, replace with its service name, e.g. ["cogno-host:8000"].
      - targets: ["host.docker.internal:8000"]
        labels: { env: prod }
