[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cogno-observability"
version = "0.1.0"
description = "SRE/Ops monitoring for the Cogno stack — Prometheus metrics sink + /metrics wiring + Grafana dashboards/alerts, and an optional OpenTelemetry trace sink in the GenAI conventions (metadata only). Cross-tenant fleet health (NOT the tenant-facing Radar Tokens; NOT billing)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Vinicius Vale" }]
maintainers = [{ name = "Sudoers AI" }]
dependencies = [
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
# The FastAPI HTTP-layer instrumentation (RED metrics per route) is optional: the business
# metrics (per-turn TurnEvent) work without it.
http = ["prometheus-fastapi-instrumentator>=7.0"]
# The OpenTelemetry trace sink (``OTelTraceSink``) is optional too: importing this package never
# imports ``opentelemetry``. The sink needs only the API. The SDK is here because a host needs a
# ``TracerProvider`` to hand it. The EXPORTER (OTLP, console, a vendor's) is the host's choice and
# is not pinned here.
otel = ["opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "prometheus-fastapi-instrumentator>=7.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "ruff>=0.5",
    "mypy>=1.8",
]

[tool.setuptools.packages.find]
include = ["cogno_observability*"]

# PEP 561. Without this marker INSIDE the built wheel, a type checker that finds this package in
# site-packages does not read a line of it: with `ignore_missing_imports = true` — which every
# repo in this stack sets, to keep third-party noise out — the whole package silently becomes
# `Any`, and every disagreement across the seam stops being an error.
#
# Measured on cogno-host 2026-09-18, and it is the reason this file exists: the host's
# `_resolve_observability` returns `(PrometheusMetricsSink(), attach)` where a
# `tuple[MetricsSink | None, ...]` is declared, and the sink had stopped satisfying `MetricsSink`
# on 2026-09-01. `mypy cogno_host` over a wheel of this package WITHOUT the marker reported the
# error 0 times; with the marker, 1; with it removed again, 0. The host's CI ran that step green
# on 2026-09-02 (run 33600599128, step "Type-check (mypy)", both 3.10 and 3.12) with the defect
# already in the tree.
#
# `package-data` is declared EXPLICITLY rather than left to `include-package-data`. MEASURED, so
# the reason is stated as it is and not as it would be convenient: on setuptools 82.0.1 the marker
# ships WITHOUT this block too (removing it and rebuilding still produced a wheel carrying
# `py.typed`), because modern setuptools discovers non-`.py` files inside a package directory on
# its own. It stays because a guarantee that rests on a default is a guarantee that moves when the
# default does, and this one is invisible when it breaks: the repo still looks typed, only the
# INSTALL is not. The guard that actually holds it is `tests/test_py_typed_ships.py`, which asserts
# against a BUILT WHEEL rather than against the checkout — and which, in its first version, passed
# over the deletion of this very file because setuptools had staged a copy in `build/lib`.
[tool.setuptools.package-data]
cogno_observability = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = ["cogno_observability"]
warn_unused_ignores = true
